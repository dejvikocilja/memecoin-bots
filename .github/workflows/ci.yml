name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: No secrets committed
        run: pnpm check:secrets
      - name: Lint and formatting
        run: pnpm lint
      - name: Build
        run: pnpm build
      - name: Type check
        run: pnpm typecheck
      - name: Tests
        run: pnpm test
